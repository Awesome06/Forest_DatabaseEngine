name: Build and Test

# Trigger this pipeline on every push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Tests
    # Use a matrix to test on both Linux and macOS (important for disk I/O)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Run Go Vet
      # Enforce standard Go idioms and detect subtle concurrency/shadowing bugs
      run: go vet ./...
      shell: bash

    - name: Run Unit & Race Tests
      # The -race flag ensures your lock-free atomic pointers are safe
      # Note: We omit -race and set CGO_ENABLED=0 on macOS due to a known Apple dyld LC_UUID linker bug
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          CGO_ENABLED=0 go test -v ./...
        else
          go test -v -race ./...
        fi
      shell: bash
