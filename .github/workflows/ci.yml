name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Race Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build
      run: go build -v ./...

    - name: Test with Race Detector
      run: go test -v -race ./...

    - name: Leak Detection
      run: |
        echo "Leak Detection Note:"
        echo "To strictly enforce no goroutine leaks in the background compaction pool,"
        echo "goleak.VerifyTestMain(m) is recommended to be integrated in TestMain(m *testing.M)"
        echo "across all internal/engine and internal/network tests."
